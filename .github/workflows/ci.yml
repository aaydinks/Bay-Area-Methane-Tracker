name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Config check
        run: uv run mw config check
      - name: Tests
        run: uv run pytest -m "not slow and not network and not db"

  db:
    # Applies supabase/migrations to an empty PostGIS database and checks the row-level rules
    # as the publishable (anon) role. The container is local to the runner; no data or API calls.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Migrations and row-level rules
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest -m db tests/db

  summary:
    # Every pull request adds summaries/NNNN-*.md, NNNN = its number (see summaries/README.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pull request adds its summary
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          prefix=$(printf 'summaries/%04d-' "$PR_NUMBER")
          added=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- summaries/)
          if ! printf '%s\n' "$added" | grep -q "^${prefix}.*\.md$"; then
            echo "::error::Add ${prefix}<short-title>.md describing this pull request (see summaries/README.md)."
            exit 1
          fi
