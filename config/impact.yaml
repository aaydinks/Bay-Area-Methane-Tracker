# Conversions for impact accounting (docs/PLAN.md section 9).
# Derived figures stay `confirmed: false` until checked against the primary source.

gwp20:
  value: 84
  source: "20-year GWP linked in the project plan"
  confirmed: false

gwp100:
  value: 25
  source: "derived: CARB 427,000 t CO2e / 17,000 t CH4 per year (two outlets)"
  confirmed: false
  note: "25 matches the IPCC AR4 value; check which assessment report the CARB rule uses"

usd_per_t_co2e:
  value: 80
  source: "derived: CARB staff $34M/yr social benefit / 427,000 t CO2e"
  confirmed: false

population_radius_km: [1, 3, 5]

# GWP EPA applied when converting GHGRP methane to the published t CO2e, by reporting year.
# Used only to recover tonnes of CH4 from GHGRP figures. Confirm against EPA's GHGRP
# documentation; reporting years after 2023 are not configured until checked.
ghgrp_gwp_ch4:
  years: [2010, 2023]
  value: 25
  source: "IPCC AR4 100-year GWP, as used in GHGRP publications for these years (to confirm)"
  confirmed: false
