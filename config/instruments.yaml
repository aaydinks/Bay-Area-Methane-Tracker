# Per-instrument detection curves and measurement error.
#
# POD(q) = Phi((ln q - ln q50) / w), q in kg/hr.
# Sources, conversions and open doubts: docs/decisions/0015-detection-curves.md.
# Every value here is derived from a published figure, not fitted to this project's data,
# so every curve stays `confirmed: false`. The persistence model refuses to fit real data
# with unconfirmed curves unless run with --allow-unconfirmed, which stamps output provisional.
#
# All curves are for a wind of about 3 m/s; the model has no wind term (PLAN 6.2).
# meas_sigma_log is only a fallback: every detection row carries its own q_sigma_log.
#
# plume_sources: the sources whose plume search covers the instrument's scenes. A real fit takes
# an instrument's passes only once one of them has written data/interim/plumes/<source>.parquet.
# An empty table counts (the search ran and found nothing). Without one, every usable pass would
# count as "looked and saw nothing" when nobody looked. Decision record 0016.

instruments:
  tanager1:
    platform: satellite
    pod:
      q50_kg_hr: 114
      w: 0.44
      source: >-
        90% POD at 200 kg/hr in Standard sensitivity mode, wind <= 3 m/s, from about 350 oil and
        gas plumes (Duren et al., IWGGMS-22 slides, Carbon Mapper, slide 3; not peer reviewed).
        Width w borrowed from the EMIT curve below (no second Tanager point published).
        q50 = 200 / exp(0.44 x 1.2816) = 114.
      confirmed: false
    meas_sigma_log:
      value: 0.51
      source: >-
        Reuland et al. 2026, Nature 658:673-681, doi:10.1038/s41586-026-11115-0, abstract:
        44% mean absolute percentage error for built-for-purpose instruments
      note: "lognormal error with no bias and MAPE 0.44 gives sigma = 0.51; a group figure, not Tanager alone"
      confirmed: false
    release_prob: { value: 1.0, source: "assumption; sensitivity runs use 0.7 and 0.85", confirmed: false }
    plume_sources: [carbonmapper]

  emit:
    platform: satellite
    pod:
      q50_kg_hr: 603
      w: 0.44
      source: >-
        Ayasse et al. 2024, ES&T 58:21536, doi:10.1021/acs.est.4c06702, Sect. POD and Fig. 1:
        90% POD at 1060 kg/hr and 2% POD at the 244 kg/hr mass-balance detection limit, both at
        3 m/s wind (Permian, Aug 2023, GAO flights coincident with EMIT). Probit through the two
        points: w = ln(1060/244) / (1.2816 + 2.0537) = 0.44; q50 = 1060 / exp(0.44 x 1.2816) = 603.
      confirmed: false
    meas_sigma_log:
      value: 0.53
      source: >-
        Reuland et al. 2026, Nature 658:673-681, doi:10.1038/s41586-026-11115-0, abstract:
        46% mean absolute percentage error for repurposed instruments
      note: "lognormal error with no bias and MAPE 0.46 gives sigma = 0.53; a group figure, not EMIT alone"
      confirmed: false
    release_prob:
      value: 1.0
      source: "assumption; EMIT plumes are manually reviewed before release"
      confirmed: false
    plume_sources: [carbonmapper, emit-v2] # Carbon Mapper republishes EMIT plumes with rates

  aircraft:
    platform: aircraft # Carbon Mapper's GAO and AVIRIS-3 flights
    pod:
      q50_kg_hr: 28.6
      w: 0.353
      source: >-
        90% POD 45 kg/hr for GAO in the 2021 controlled releases (Ayasse et al. 2023, AMT
        16:6065, doi:10.5194/amt-16-6065-2023, Sect. 3.4; mean wind 2.5 m/s, about 3 km
        altitude). Width from AVIRIS-NG, 21 kg/hr at 50% and 33 kg/hr at 90% at 3000 m and
        3 m/s (Conrad et al. 2023, RSE 288:113499, doi:10.1016/j.rse.2023.113499, Sect. 4,
        Table 2, partial detections excluded): w = ln(33/21) / 1.2816 = 0.353;
        q50 = 45 / exp(0.353 x 1.2816) = 28.6.
      confirmed: false
    meas_sigma_log:
      value: 0.53
      source: >-
        El Abbadi et al. 2024, ES&T 58:9591, doi:10.1021/acs.est.4c02439, Table 3: Carbon
        Mapper stage 1, 68% of 71 estimates within 50% of the metered rate
      note: "lognormal error with no bias and 68% inside [0.5, 1.5] x metered gives sigma = 0.53"
      confirmed: false
    release_prob: { value: 1.0, source: "assumption", confirmed: false }
    plume_sources: [carbonmapper]

  sentinel2:
    platform: satellite
    pod:
      q50_kg_hr: 7070
      w: 0.312
      source: >-
        Gorrono et al. 2023, AMT 16:89, doi:10.5194/amt-16-89-2023, Table 2, Permian Basin in
        summer (mixed vegetated and bare ground, 221 simulated plumes per level): 15, 52, 87, 97%
        detected at 5000, 7500, 10000, 12500 kg/hr. Least-squares probit fit on ln q gives
        q50 = 7070, w = 0.312.
      confirmed: false
    meas_sigma_log:
      value: 0.46
      source: >-
        Sherwin et al. 2023, Sci. Rep. 13:3836, doi:10.1038/s41598-023-30761-2, Results: 75% of
        satellite estimates (all satellites pooled) within 50% of the metered rate
      note: "lognormal error with no bias and 75% inside [0.5, 1.5] x metered gives sigma = 0.46"
      confirmed: false
    release_prob: { value: 1.0, source: "local retrieval; no review step", confirmed: false }
    plume_sources: [s2-local] # the project's own search (PLAN phase 3)
