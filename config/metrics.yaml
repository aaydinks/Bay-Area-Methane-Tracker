# The catalogue of measures shown beside the methane estimate (ADR 0019).
#
# Every row of the `site_metrics` table names one id from this file. The catalogue is published
# with each copy as `metric_catalogue`, in this order, so the labels and caveats below are page
# text and go through the wording check.
#
#   label    what the page calls the measure
#   unit     the unit the source publishes it in; nothing is converted
#   kind     reported (an operator or agency says so), observed (the project counted it in
#            public data) or context (describes the surroundings, never the landfill)
#   source   a key of config/data_terms.yaml, which decides whether rows may be shown
#   caveat   the sentence shown beside the measure
#
# A new measure is an entry here and an ingest step that writes rows for it under
# data/interim/site_metrics/. A row whose id is not listed here stops `mw publish build`.
measures:
  # EPA Greenhouse Gas Reporting Program, per gas, in t CO2e as EPA publishes it. Subpart and
  # gas codes checked against Envirofacts (pub_dim_subpart, pub_dim_ghg) on 2026-11-23:
  # subpart HH (municipal landfills) is id 31, subpart C (stationary combustion) is id 1;
  # gases are 1 CO2, 2 CH4, 3 N2O, 8 biogenic CO2.
  epa_landfill_ch4:
    label: "Methane from the landfill"
    unit: "t CO2e"
    kind: reported
    source: ghgrp
    caveat: >-
      Calculated by the operator with EPA's method, not measured. EPA publishes it as tonnes of
      CO2 equivalent.
  epa_combustion_biogenic_co2:
    label: "Biogenic CO2 from burning fuel on site"
    unit: "t CO2e"
    kind: reported
    source: ghgrp
    # EPA treats CO2 from burning landfill gas as biogenic (40 CFR 98.33(e), Table C-1;
    # checked 2026-11-23).
    caveat: >-
      CO2 from burning landfill gas is counted here. Filed only by sites that report stationary
      combustion to EPA.
  epa_combustion_co2:
    label: "Other CO2 from burning fuel on site"
    unit: "t CO2e"
    kind: reported
    source: ghgrp
    caveat: >-
      CO2 from fuel that EPA does not count as biogenic. Filed only by sites that report
      stationary combustion to EPA.
  epa_combustion_ch4:
    label: "Methane from burning fuel on site"
    unit: "t CO2e"
    kind: reported
    source: ghgrp
    caveat: "Filed only by sites that report stationary combustion to EPA."
  epa_combustion_n2o:
    label: "Nitrous oxide from burning fuel on site"
    unit: "t CO2e"
    kind: reported
    source: ghgrp
    caveat: "Filed only by sites that report stationary combustion to EPA."
  # Carbon Mapper's CO2 search, as counts per landfill and year (ADR 0024). Counted by
  # `mw ingest carbonmapper-co2` from its CO2 plume list and CO2 scene lists; nothing is
  # modelled. "500 m" below is attribution.buffer_m in project.yaml, and a test keeps the two
  # in step.
  cm_co2_passes:
    label: "Days searched for CO2"
    unit: "count"
    kind: observed
    source: carbonmapper-co2
    caveat: >-
      Days on which a scene that Carbon Mapper searched for CO2 covered the landfill. A year
      with no figure was not searched.
  cm_co2_plumes:
    label: "CO2 plumes found on or beside the landfill"
    unit: "count"
    kind: observed
    source: carbonmapper-co2
    caveat: >-
      Plumes that start on the landfill's outline or within 500 m of it, whatever source Carbon
      Mapper tagged them with. A plume beside a landfill can come from a neighbouring plant.
      This search picks up only very large CO2 sources, such as power plants, so "none found"
      does not mean no CO2.
  # EPA's landfill gas program database (LMOP), as its California workbook lists each landfill
  # (ADR 0025). The meanings below are EPA's own field descriptions in the workbook, read
  # 2026-11-27. These rows carry the file's edition (such as 2024-09) as their period, not a
  # reporting year, and `mw ingest lmop` writes them in EPA's units.
  lmop_waste_in_place:
    label: "Waste in place"
    unit: "short tons"
    kind: reported
    source: epa-lmop
    caveat: >-
      All the waste buried at the landfill so far, in short tons (2,000 pounds each). EPA does
      not update this figure every year.
  lmop_waste_in_place_year:
    label: "Year of the waste-in-place figure"
    unit: "year"
    kind: reported
    source: epa-lmop
    caveat: "Listed only where EPA gives the year."
  lmop_gas_system:
    label: "Gas collection system in place"
    unit: "yes or no"
    kind: reported
    source: epa-lmop
    caveat: >-
      "Yes" means a system that actively draws gas out of the landfill. EPA writes "No" where
      there is no system, where gas only vents or flares passively, or where the only wells are
      around the edge.
  lmop_gas_collected:
    label: "Landfill gas collected"
    unit: "million standard cubic feet a day"
    kind: reported
    source: epa-lmop
    caveat: >-
      All of the gas the system draws out, not methane alone. It is not the amount the landfill
      makes, and it is not the amount that escapes.
  lmop_gas_flared:
    label: "Landfill gas flared"
    unit: "million standard cubic feet a day"
    kind: reported
    source: epa-lmop
    caveat: >-
      Gas burned in flares. Where an energy project is running, EPA lists the gas burned in
      back-up flares.
  lmop_projects_running:
    label: "Energy projects running"
    unit: "count"
    kind: reported
    source: epa-lmop
    caveat: >-
      Projects that turn the landfill's gas into electricity, heat or fuel and that EPA lists
      as operational. Projects that have shut down or are only planned are not counted.
  lmop_project_types:
    label: "Types of energy project running"
    unit: "list"
    kind: reported
    source: epa-lmop
    caveat: "As EPA names them."
  # CalEnviroScreen 5.0, the state's score for each census tract (ADR 0026). Context only
  # (ADR 0020): these describe the area around a landfill and are never attributed to it.
  # Written by `mw ingest calenviroscreen` from the outline of each landfill; nothing is
  # averaged across tracts. Column meanings read from OEHHA's data dictionary on 2026-11-28.
  ces_tract:
    label: "Census tract the landfill sits in"
    unit: "census tract"
    kind: context
    source: calenviroscreen
    caveat: >-
      The tract that holds the largest part of the landfill's outline, by its 2020 Census
      number.
  ces_tract_population:
    label: "People living in that tract"
    unit: "people"
    kind: context
    source: calenviroscreen
    caveat: "The 2024 five-year census estimate, as the state's file gives it."
  ces_score_percentile:
    label: "CalEnviroScreen overall percentile of that tract"
    unit: "percentile"
    kind: context
    source: calenviroscreen
    caveat: >-
      The state scores every census tract by combining measures of pollution with measures of
      the people living there. A percentile of 70 means the tract scores higher than about 70%
      of California's tracts. A higher score means, by the state's method, more pollution
      burden and a population more vulnerable to it. The score counts solid waste sites near
      homes, so a landfill can be part of its own tract's score.
  ces_pollution_percentile:
    label: "Pollution Burden percentile of that tract"
    unit: "percentile"
    kind: context
    source: calenviroscreen
    caveat: >-
      One of the two parts of the overall score: the state's measures of pollution in the
      tract from every kind of source, such as traffic, industry, pesticides and waste sites.
  ces_population_percentile:
    label: "Population Characteristics percentile of that tract"
    unit: "percentile"
    kind: context
    source: calenviroscreen
    caveat: >-
      The other part of the overall score: the state's measures of the people living in the
      tract, such as poverty, education and the rates of certain illnesses.
  ces_tracts_nearby:
    label: "Census tracts within 1 km of the outline"
    unit: "count"
    kind: context
    source: calenviroscreen
    caveat: "Every tract with any part within 1 km of the landfill's outline, its own included."
  ces_nearby_lowest:
    label: "Lowest overall percentile among those tracts"
    unit: "percentile"
    kind: context
    source: calenviroscreen
    caveat: >-
      The lowest and the highest are given as the state publishes them for those tracts.
      Nothing is averaged across tracts.
  ces_nearby_highest:
    label: "Highest overall percentile among those tracts"
    unit: "percentile"
    kind: context
    source: calenviroscreen
