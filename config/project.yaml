# Project-wide settings. Paths are relative to the repository root.

crs_geographic: "EPSG:4326"
crs_metric: "EPSG:32610" # UTM zone 10N, for buffers and distances in metres

paths:
  registry: data/registry # hand-curated, committed
  raw: data/raw # immutable downloads + manifest.json per pull
  interim: data/interim # normalized Parquet
  processed: data/processed # model inputs and outputs
  datasets: datasets # committed copy of each source dataset, one folder per source
  reports: reports

attribution:
  buffer_m: 500 # plume origin within polygon + buffer -> attributed to the site
  search_radius_km: 5 # pull every plume within this distance of a site

coverage:
  min_coverage_frac: 0.8 # share of the site polygon inside the footprint
  min_valid_frac: 0.7 # share of covered pixels that are cloud-free / unmasked

repair:
  window_months: 12
  gap_days: 14 # overpasses this close to a repair are excluded
  min_overpasses_per_window: 5
  # Call "drop" when P(decrease) >= call_probability, "rise" when P(decrease) <= 1 - it.
  # 0.975 is a two-sided 95% test (nominal false-positive rate 5%), leaving room under the
  # 10% placebo gate. The reported interval stays at interval_mass (90%). ADR 0006.
  call_probability: 0.975
