[project]
name = "methanewatch"
version = "0.1.0"
description = "Retrospective, satellite-based screening of methane emissions from Bay Area landfills."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aaydinks" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # tables and storage
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandera>=0.24",
    # config and CLI
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    # network
    "httpx>=0.27",
    "tenacity>=9.0",
    # geo and rasters
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "rioxarray>=0.17",
    "xarray>=2024.7",
    # catalogs
    "pystac-client>=0.8",
    "earthaccess>=0.11",
    # model
    "pymc>=5.16",
    "arviz>=0.19",
    # reporting
    "altair>=5.4",
    "jinja2>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# The wind product is chosen in week 3 (docs/decisions/0002-wind-product.md).
wind = ["herbie-data>=2024.8", "cdsapi>=0.7"]
# Faster NUTS sampler for the synthetic-coverage and placebo runs.
fast = ["nutpie>=0.13"]

[project.scripts]
mw = "methanewatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/methanewatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running statistical checks (excluded from CI by default)",
    "network: needs network access or credentials (never run in CI)",
]
